# CI: host tests (C + Python), static analysis, fuzzing, firmware build, one
# merged test report.
# Runs locally the same way with _TEST/run_tests.ps1 (see _TEST/README.md).

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      hil:
        description: "Also run the hardware-in-the-loop job (needs a self-hosted runner with a DK)"
        type: boolean
        default: false
      hil_pair:
        description: "Also run the pairing hardware job (needs a self-hosted runner with two DKs)"
        type: boolean
        default: false
      hil_uds:
        description: "Also run the UDS hardware job (a DK with its CAN click and a USB-CAN adapter on one bus)"
        type: boolean
        default: false

env:
  NCS_VERSION: v3.4.1
  BOARD: nrf54l15dk/nrf54l15/cpuapp

jobs:
  # ---- Tier 1: C unit tests of _LIB and _ASW on the host ----------------------
  # CMake also fetches and builds Mbed TLS 4.1.1 (pinned by hash) for
  # devicecert_verify, under the same sanitizers
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ninja-build
          pip install -r _TEST/requirements-test.txt
      - name: Configure (ASan + UBSan + coverage)
        run: cmake -G Ninja -S _TEST -B build_test -DSANITIZE=ON -DCOVERAGE=ON
      - name: Build
        run: cmake --build build_test
      - name: Test
        run: ctest --test-dir build_test --output-on-failure
      - name: Coverage
        if: always()
        run: |
          mkdir -p build_test/report/coverage/c
          gcovr --root . --object-directory build_test --filter '_LIB/' --filter '_ASW/' \
            --html-details build_test/report/coverage/c/index.html \
            --cobertura build_test/report/coverage/c/cobertura.xml --print-summary \
            | tee build_test/report/coverage/c/summary.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-c
          path: build_test/report/

  # ---- Tier 2: PC tools (_TOOLS/BleHostGUI) -----------------------------------
  python-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q xvfb
          pip install -r _TEST/requirements-test.txt
      # xvfb: a virtual display, so the tests that build the real Tk window and pages run
      # here too (they skip themselves where Tk has no display)
      - name: Test
        run: |
          mkdir -p report
          xvfb-run -a pytest _TEST/python -q -p no:cacheprovider \
            --junitxml=report/junit/python.xml -o junit_suite_name=python_tools \
            --cov=_TOOLS/BleHostGUI --cov=_TOOLS/MemReport \
            --cov-report=html:report/coverage/python \
            --cov-report=term | tee report/coverage-python.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-python
          path: report/

  # ---- Static analysis: cppcheck (_ASW, _LIB), ruff and bandit (_TOOLS) --------
  # The same gate as run_tests.ps1 -Static (_TEST/tools/run_static.py)
  static-analysis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q cppcheck
          pip install ruff bandit
      - name: Static analysis
        run: python _TEST/tools/run_static.py .

  # ---- Fuzzing: the code that parses bytes from outside (libFuzzer) -----------
  # _TEST/fuzz: frames from a BLE peer (SETU receive path, file and UDS
  # commands), ECU answers off CAN (UDS client) and stored files (flash job),
  # under ASan + UBSan; a short run per target, as run_tests.ps1 -Fuzz
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install tools
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build clang
      - name: Build
        run: |
          cmake -G Ninja -S _TEST/fuzz -B build_fuzz -DCMAKE_C_COMPILER=clang
          cmake --build build_fuzz
      - name: Fuzz (60 s per target)
        run: python _TEST/tools/run_fuzz.py build_fuzz 60
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-crashes
          path: build_fuzz/crash/

  # ---- Tier 3: the real firmware, in Nordic's toolchain container -------------
  # Once per external flash interface (FLASH_IF in the root CMakeLists.txt): SPI
  # (the default, flashed by the hardware jobs) and the sQSPI soft peripheral
  firmware-build:
    strategy:
      fail-fast: false
      matrix:
        flash_if: [spi, sqspi]
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/nrfconnect/sdk-nrf-toolchain:v3.4.1   # keep in step with NCS_VERSION
      env:
        ACCEPT_JLINK_LICENSE: 1
    defaults:
      run:
        shell: bash          # the container needs bash to load the toolchain environment
    steps:
      - uses: actions/checkout@v7
        with:
          path: app
      - name: Cache the NCS workspace
        uses: actions/cache@v6
        with:
          path: ncs
          key: ncs-${{ env.NCS_VERSION }}
      - name: West workspace
        run: |
          git config --global --add safe.directory '*'
          if [ ! -d ncs/.west ]; then
            west init -m https://github.com/nrfconnect/sdk-nrf --mr "$NCS_VERSION" ncs
          fi
          cd ncs && west update --narrow -o=--depth=1
      - name: Build (sysbuild, pristine)
        working-directory: ncs
        run: |
          west build -p -b "$BOARD" --sysbuild -d "$GITHUB_WORKSPACE/build_ci" "$GITHUB_WORKSPACE/app" \
            -- -DFLASH_IF=${{ matrix.flash_if }} 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          test "${PIPESTATUS[0]}" -eq 0
      # Every CONFIG_ symbol the sources test must be one this build knows
      # (a mistyped or foreign symbol silently compiles its branch out)
      - name: Kconfig symbols used by the sources
        run: python3 app/_TEST/tools/check_config_symbols.py app build_ci/app/zephyr/.config
      # The hardware jobs flash an image that opens the host window at every boot
      # (nobody presses Button 3 on a runner; _DOC/HostAuth/PROTOCOL.md §1)
      - name: Build the HIL image (host window at boot)
        if: matrix.flash_if == 'spi'
        working-directory: ncs
        run: |
          west build -p -b "$BOARD" --sysbuild -d "$GITHUB_WORKSPACE/build_hil" "$GITHUB_WORKSPACE/app" \
            -- -DFLASH_IF=spi -Dapp_CONFIG_HOST_AUTH_BOOT_WINDOW=y
          grep -q '^CONFIG_HOST_AUTH_BOOT_WINDOW=y' "$GITHUB_WORKSPACE/build_hil/app/zephyr/.config"
      - uses: actions/upload-artifact@v7
        if: matrix.flash_if == 'spi'
        with:
          name: firmware-hil
          path: build_hil/merged.hex
      - name: Memory usage
        run: |
          {
            echo "## Firmware ($BOARD, NCS $NCS_VERSION, flash over ${{ matrix.flash_if }})"
            echo '```'
            grep -A6 'Memory region' build.log | tail -n 7
            echo '```'
            echo '```'
            cat build_ci/app/zephyr/mem_report.txt     # per module, _TOOLS/MemReport
            echo '```'
          } | tee firmware-size.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          # "firmware" (SPI) is what the hardware jobs flash
          name: ${{ matrix.flash_if == 'spi' && 'firmware' || format('firmware-{0}', matrix.flash_if) }}
          path: |
            build_ci/merged.hex
            build_ci/app/zephyr/zephyr.elf
            build_ci/app/zephyr/.config
            build.log
            firmware-size.md

  # ---- One report for all tiers -----------------------------------------------
  report:
    needs: [host-tests, python-tests]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      checks: write            # test results as a check run with annotations
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: report-*
          path: reports
      - name: Collect JUnit files
        run: mkdir -p junit && cp reports/*/junit/*.xml junit/
      - name: Summary
        run: |
          python3 _TEST/tools/report.py junit --md summary.md --html report.html \
            --title "Project Hanuman tests"
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          c=reports/report-c/coverage/c/summary.txt
          py=reports/report-python/coverage-python.txt
          if [ -f "$c" ]; then
            { echo; echo '### C coverage (gcovr, _LIB and _ASW)'; echo '```'
              grep -E '^(lines|functions|branches):' "$c"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$py" ]; then
            # The whole table, from its "Name Stmts Miss Cover" header to TOTAL
            { echo; echo '### Python coverage (pytest-cov, _TOOLS/BleHostGUI)'
              echo 'Stmts = executable statements, Miss = statements no test ran, Cover = share that ran.'
              echo '```'; sed -n '/^Name /,/^TOTAL/p' "$py"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: junit/*.xml
          check_name: Test results
          include_passed: false
          detailed_summary: true
      - uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: |
            report.html
            summary.md
            junit/

  # ---- Placeholder: hardware in the loop --------------------------------------
  # Needs a self-hosted runner labelled nrf54l15dk: a PC with the DK on USB, a
  # BLE adapter, nrfutil/west, and Python with bleak. Only runs on request.
  hil-tests:
    needs: firmware-build
    if: github.event_name == 'workflow_dispatch' && inputs.hil
    runs-on: [self-hosted, nrf54l15dk]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: firmware-hil
          path: fw
      - name: Flash
        run: nrfutil device program --firmware fw/merged.hex --options chip_erase_mode=ERASE_ALL
      # Device provisioning (_DOC/Provisioning/PROTOCOL.md): the runner hosts the
      # PC-side SETU service (Windows), acts as the CA and provisions the DK.
      # The chip erase above makes the device generate a fresh key and CSR, and an
      # unprovisioned device takes nothing but provisioning.
      # --negative sends every certificate the device must reject
      # (blehost/pki/negative.py) before the good CA and device certificate (a
      # provisioned device refuses certificates; a non-fresh one is wiped first)
      # and fails on any wrong RESULT: the set the host test devicecert_verify
      # runs too, here on the device's own mbedTLS, PSA and CRACEN.
      - name: Provision the device and test its certificate verification
        run: python _TOOLS/BleHostGUI/setu_client.py provision --negative --name "ProjectHanuman" --ca ${{ runner.temp }}/ca --out ${{ runner.temp }}/device.pem
      - name: Check the issued certificate against the CA
        run: openssl verify -CAfile ${{ runner.temp }}/ca/ca_cert.pem ${{ runner.temp }}/device.pem
      # Host authentication (_DOC/HostAuth/PROTOCOL.md): the runner becomes the
      # device's trusted host. An untrusted host's disconnect closes the window,
      # so the reset reopens it (boot window); a trusted host's disconnect opens
      # the 60 s grace window, enough for each following command.
      - name: Become the trusted host
        shell: pwsh
        run: |
          $cli = "_TOOLS/BleHostGUI/setu_client.py"
          nrfutil device reset
          python $cli hostcert "HIL runner" --ca ${{ runner.temp }}/ca --host ${{ runner.temp }}/host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python $cli auth --name "ProjectHanuman" --host ${{ runner.temp }}/host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $out = python $cli authstatus --name "ProjectHanuman" | Out-String
          if ($out -notmatch "TRUSTED") { throw "not trusted: $out" }
      - name: Upload AA00000100.hex over BLE
        run: python _TOOLS/BleHostGUI/setu_client.py hex AA00000100.hex --name "ProjectHanuman"
      # The file system on the external flash (_DOC/FileSysManager): the upload
      # stored as a file (the client checks the size and CRC-32 COMMIT reports),
      # listed, read back over the file commands, and compared byte for byte
      # with the records the hex file gives; then again after a reset.
      - name: Store the upload as a file and read it back
        shell: pwsh
        run: |
          $cli = "_TOOLS/BleHostGUI/setu_client.py"
          python $cli hex AA00000100.hex --store HIL.BIN --name "ProjectHanuman"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python $cli fs ls --name "ProjectHanuman"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python $cli fs get /FW/HIL.BIN ${{ runner.temp }}/hil.bin --name "ProjectHanuman"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          nrfutil device reset
          python $cli fs get /FW/HIL.BIN ${{ runner.temp }}/hil_after_reset.bin --name "ProjectHanuman"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import sys; sys.path.insert(0, '_TOOLS/BleHostGUI'); import setu_client as bx; want = bx.file_image(bx.parse_ihex('AA00000100.hex')); got = [open(f, 'rb').read() for f in sys.argv[1:]]; sys.exit(0 if all(g == want for g in got) else 'stored file differs')" ${{ runner.temp }}/hil.bin ${{ runner.temp }}/hil_after_reset.bin
      # One-time provisioning: a provisioned device refuses another run, so the
      # second provision must fail; DEPROVISION (the trusted host's) wipes the ITS
      # credentials and every bond, and a new key and CSR make it provisionable
      # again (after a reset: the wiped host is no longer trusted, no grace window).
      - name: A provisioned device refuses another provisioning
        shell: pwsh
        run: |
          python _TOOLS/BleHostGUI/setu_client.py provision --name "ProjectHanuman" --ca ${{ runner.temp }}/ca
          if ($LASTEXITCODE -eq 0) { throw "provisioned twice" } else { $global:LASTEXITCODE = 0 }
      - name: Wipe the provisioning and provision again
        shell: pwsh
        run: |
          python _TOOLS/BleHostGUI/setu_client.py deprovision --name "ProjectHanuman"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          nrfutil device reset
          python _TOOLS/BleHostGUI/setu_client.py provision --name "ProjectHanuman" --ca ${{ runner.temp }}/ca
      # Next step when it exists: a second BLE adapter as an untrusted host, which
      # must get REFUSED for hex, files and DEPROVISION, and HOST_BONDED for HELLO.
      # Next step when it exists: capture the UART and check the
      # "SEG addr=0x00000000 len=6560 crc=0xe2e72827" line, the two PEM blocks,
      # "device provisioned", and after a reset "provisioned: stored
      # certificates verified".

  # ---- Pairing on hardware: two DKs (placeholder, manual) ----------------------
  # Device pairing (_DOC/Pairing/PROTOCOL.md) between two DKs on one Windows
  # runner. The runner's variables give each DK's J-Link serial number and BLE
  # address (both DKs advertise the same name, so they are told apart by
  # address): DK_A_SNR, DK_A_ADDR, DK_B_SNR, DK_B_ADDR.
  hil-pair-tests:
    needs: firmware-build
    if: github.event_name == 'workflow_dispatch' && inputs.hil_pair
    runs-on: [self-hosted, nrf54l15dk-pair]
    env:
      CLI: python _TOOLS/BleHostGUI/setu_client.py
      A: ${{ vars.DK_A_ADDR }}
      B: ${{ vars.DK_B_ADDR }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: firmware-hil
          path: fw
      - name: Flash both DKs (fresh keys, no bonds, host window at boot)
        run: |
          nrfutil device program --serial-number ${{ vars.DK_A_SNR }} --firmware fw/merged.hex --options chip_erase_mode=ERASE_ALL
          nrfutil device program --serial-number ${{ vars.DK_B_SNR }} --firmware fw/merged.hex --options chip_erase_mode=ERASE_ALL
      - name: Provision both with the same CA
        run: |
          ${{ env.CLI }} provision --address ${{ env.A }} --ca ${{ runner.temp }}/ca
          ${{ env.CLI }} provision --address ${{ env.B }} --ca ${{ runner.temp }}/ca
      # CONTROL takes START only from each device's trusted host
      # (_DOC/HostAuth/PROTOCOL.md); the resets reopen the host windows
      - name: Become the trusted host of both
        run: |
          nrfutil device reset --serial-number ${{ vars.DK_A_SNR }}
          nrfutil device reset --serial-number ${{ vars.DK_B_SNR }}
          ${{ env.CLI }} hostcert "HIL runner" --ca ${{ runner.temp }}/ca --host ${{ runner.temp }}/host
          ${{ env.CLI }} auth --address ${{ env.A }} --host ${{ runner.temp }}/host
          ${{ env.CLI }} auth --address ${{ env.B }} --host ${{ runner.temp }}/host
      # Exit code 0 only when both devices end PAIRED: certificates exchanged and
      # verified, signed OOB data verified, LE SC OOB pairing at level 4, bonded,
      # SECURED written over the encrypted link
      - name: Pair A (central) with B (peripheral)
        run: ${{ env.CLI }} pair --central ${{ env.A }} --peripheral ${{ env.B }}
      - name: The bond survives a reset
        shell: pwsh
        run: |
          nrfutil device reset --serial-number ${{ vars.DK_A_SNR }}
          nrfutil device reset --serial-number ${{ vars.DK_B_SNR }}
          Start-Sleep -Seconds 3
          foreach ($d in "${{ env.A }}", "${{ env.B }}") {
            $out = ${{ env.CLI }} pairstatus --address $d | Out-String
            if ($out -notmatch "PAIRED") { throw "no bond after reset: $out" }
          }
      # A device certified by another CA is refused: the run fails (PEER_CERT)
      - name: A device of another CA cannot pair
        shell: pwsh
        run: |
          ${{ env.CLI }} unpair --address ${{ env.A }}
          ${{ env.CLI }} deprovision --address ${{ env.B }}
          nrfutil device reset --serial-number ${{ vars.DK_B_SNR }}
          ${{ env.CLI }} provision --address ${{ env.B }} --ca ${{ runner.temp }}/other_ca
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # B now trusts hosts of the other CA only
          nrfutil device reset --serial-number ${{ vars.DK_B_SNR }}
          ${{ env.CLI }} hostcert "HIL runner" --ca ${{ runner.temp }}/other_ca --host ${{ runner.temp }}/other_host
          ${{ env.CLI }} auth --address ${{ env.B }} --host ${{ runner.temp }}/other_host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          nrfutil device reset --serial-number ${{ vars.DK_A_SNR }}
          $out = ${{ env.CLI }} pair --central ${{ env.A }} --peripheral ${{ env.B }} | Out-String
          if ($LASTEXITCODE -eq 0) { throw "paired across CAs" } else { $global:LASTEXITCODE = 0 }
          if ($out -notmatch "certificate was rejected") { throw "unexpected failure: $out" }

  # ---- UDS on hardware: a DK, its CAN click, a USB-CAN adapter (placeholder, manual) ----
  # The DK (VDD 3.3 V, MCP2518FD Click, _DOC/CAN/README.md) and the runner's USB-CAN
  # adapter on one terminated bus; the adapter runs the ECU simulator
  # (_TOOLS/EcuSim). Runner variables: CAN_IFACE, CAN_CHANNEL (python-can).
  # The flash job (_DOC/UDS/README.md) must end DONE with the image the simulator
  # received equal to the stored file, and an injected NRC must fail it cleanly.
  hil-uds-tests:
    needs: firmware-build
    if: github.event_name == 'workflow_dispatch' && inputs.hil_uds
    runs-on: [self-hosted, nrf54l15dk-can]
    env:
      CLI: python _TOOLS/BleHostGUI/setu_client.py
      PROFILE: _TOOLS/EcuSim/profiles/sim.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: firmware-hil
          path: fw
      - name: Flash the DK, provision it, become its trusted host
        shell: pwsh
        run: |
          nrfutil device program --firmware fw/merged.hex --options chip_erase_mode=ERASE_ALL
          ${{ env.CLI }} provision --name "ProjectHanuman" --ca ${{ runner.temp }}/ca
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          nrfutil device reset
          ${{ env.CLI }} hostcert "HIL runner" --ca ${{ runner.temp }}/ca --host ${{ runner.temp }}/host
          ${{ env.CLI }} auth --name "ProjectHanuman" --host ${{ runner.temp }}/host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Store the image, flash it into the simulated ECU, compare
        shell: pwsh
        run: |
          pip install -r _TOOLS/EcuSim/requirements.txt
          $sim = Start-Process -PassThru -NoNewWindow python -ArgumentList "_TOOLS/EcuSim/ecu_sim.py --interface ${{ vars.CAN_IFACE }} --channel ${{ vars.CAN_CHANNEL }} --quiet --out ${{ runner.temp }}/flashed.bin"
          try {
            ${{ env.CLI }} hex AA00000100.hex --store HIL.BIN --name "ProjectHanuman"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            ${{ env.CLI }} uds target --profile ${{ env.PROFILE }} --name "ProjectHanuman"
            ${{ env.CLI }} uds req 22F190 --name "ProjectHanuman"
            ${{ env.CLI }} flash HIL.BIN --profile ${{ env.PROFILE }} --name "ProjectHanuman"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            ${{ env.CLI }} fs get /FW/HIL.BIN ${{ runner.temp }}/stored.bin --name "ProjectHanuman"
            if ((Get-FileHash ${{ runner.temp }}/stored.bin).Hash -ne (Get-FileHash ${{ runner.temp }}/flashed.bin).Hash) {
              throw "the ECU received another image"
            }
          } finally { Stop-Process -Id $sim.Id }
      - name: An NRC fails the job cleanly, and the next one succeeds
        shell: pwsh
        run: |
          $sim = Start-Process -PassThru -NoNewWindow python -ArgumentList "_TOOLS/EcuSim/ecu_sim.py --interface ${{ vars.CAN_IFACE }} --channel ${{ vars.CAN_CHANNEL }} --quiet --nrc-at 36:72"
          try {
            ${{ env.CLI }} flash HIL.BIN --profile ${{ env.PROFILE }} --name "ProjectHanuman"
            if ($LASTEXITCODE -eq 0) { throw "a flash with NRC 0x72 succeeded" } else { $global:LASTEXITCODE = 0 }
            ${{ env.CLI }} flash HIL.BIN --profile ${{ env.PROFILE }} --name "ProjectHanuman"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Stop-Process -Id $sim.Id }
