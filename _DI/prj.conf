#*******************************************************************************
#
# Application (options defined in _DI/Kconfig)
#
#*******************************************************************************
# Print only one summary line per received segment. Set to y to print every byte
# for debugging; that holds the upload for several seconds per 64 KiB segment.
CONFIG_DS_HEX_DUMP=n

#*******************************************************************************
#
# File system (FAT volume FLASH_DISK on the external NOR flash, _LIB/FileSysManager)
#
#*******************************************************************************
# The flash interface (SPI or sQSPI) and its page size come from
# _DI/conf/flash_<if>.conf, picked by FLASH_IF in the root CMakeLists.txt.
# Disk access layer on a flash partition (the zephyr,flash-disk node)
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_FLASH=y
# FAT file system (ELM FatFs) with formatting
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FAT_FILESYSTEM_ELM=y
# Format the volume if it is not formatted yet
CONFIG_FS_FATFS_MOUNT_MKFS=y
# Long file names, up to 255 characters
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_MAX_LFN=255
# The volume is mounted as "/FLASH_DISK:", the flash disk's name
CONFIG_FS_FATFS_CUSTOM_MOUNT_POINT_COUNT=1
CONFIG_FS_FATFS_CUSTOM_MOUNT_POINTS="FLASH_DISK"
# Collect written data into larger flash writes (options in _DI/Kconfig)
CONFIG_FSMGR_BUFFERED_WRITE=y
# File commands over BLE for the GUI's Files page and setu_client.py fs
CONFIG_FS_CMD=y
CONFIG_FS_LOG_LEVEL_INF=y

#*******************************************************************************
#
# State Machine Framework
#
#*******************************************************************************
# Enable the State Machine Framework in Zephyr
CONFIG_SMF=y

#*******************************************************************************
#
# Device certificate (key pair, CSR, certificate verification)
#
#*******************************************************************************
# PSA Crypto on the CRACEN hardware accelerator (nRF54L), as in NCS's
# samples/crypto/persistent_key_usage for nrf54l15dk/nrf54l15/cpuapp
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_CRYPTO_DRIVER_OBERON=n
CONFIG_PSA_CRYPTO_DRIVER_CRACEN=y
CONFIG_PSA_WANT_GENERATE_RANDOM=y
# ECDSA P-256 device key: generate, sign (CSR), export the public key
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
# SHA-256 (ECDSA, certificate hashing) and SHA-1 (CSR SKI, CN UUIDv5)
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_SHA_1=y
# Host authentication (_HOST_AUTH): ECDH of ephemeral keys, the passkey derived
# with HKDF-SHA256 (BT_SMP wants ECDH too; it is asked for here explicitly)
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ALG_HKDF=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_KEY_TYPE_DERIVE=y
# The CN is a UUIDv5 of the hardware device ID
CONFIG_HWINFO=y

# Persistent PSA key, the CSR and the certificates in PSA Internal Trusted
# Storage. Without TF-M the ITS is Zephyr's secure storage, kept with the
# settings subsystem on ZMS.
CONFIG_MBEDTLS_PSA_CRYPTO_STORAGE_C=y
CONFIG_SECURE_STORAGE=y
# The CSR/certificate storage UIDs are 64-bit ("CSR"..., "DEVCERT"...)
CONFIG_SECURE_STORAGE_64_BIT_UID=y
# One ITS entry holds a whole CSR record (up to 1059 bytes) or certificate
# record (up to 1027 bytes); default is 128
CONFIG_SECURE_STORAGE_ITS_MAX_DATA_SIZE=1100
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_SETTINGS=y

# X.509 certificate parsing and verification (mbedTLS on top of PSA). The X.509
# library itself has no prompt: nrf_security enables it whenever PSA ECDH is
# wanted, which the Bluetooth host's LE Secure Connections (BT_SMP) does. The
# X.509 sources (mbedx509) are built by Zephyr's Mbed TLS module, so it is on.
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_X509_USE_C=y
CONFIG_MBEDTLS_X509_CRT_PARSE_C=y
CONFIG_MBEDTLS_X509_CSR_PARSE_C=y
CONFIG_MBEDTLS_X509_CHECK_KEY_USAGE=y
# extendedKeyUsage clientAuth marks host certificates (DeviceCert_Verify.c)
CONFIG_MBEDTLS_X509_CHECK_EXTENDED_KEY_USAGE=y
CONFIG_MBEDTLS_PK_PARSE_C=y
CONFIG_MBEDTLS_ASN1_PARSE_C=y
# Parsed certificates and the CA trust anchor live on the mbedTLS heap
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=8192

# Verified certificates are logged as PEM (base64)
CONFIG_BASE64=y

# Holding DK Button 0 wipes the provisioning credentials (ProvButton.c); Button 3
# has a handler of its own (HostAuthButton.c, dk_button_handler_add())
CONFIG_DK_LIBRARY=y
CONFIG_DK_LIBRARY_DYNAMIC_BUTTON_HANDLERS=y
CONFIG_PROV_WIPE_HOLD_MS=5000

# Key generation, CSR build and ITS access run from main() (and from the
# provisioning thread, PROV_STACK_SIZE); ITS calls put an entry-sized buffer on
# the stack: about 7.2 KiB on the deepest static path, before interrupt frames
# and calls through function pointers (audit F4)
CONFIG_MAIN_STACK_SIZE=10240

#*******************************************************************************
#
# CAN bus (MCP2518FD Click on spi21, _ASW/_CAN; _DOC/CAN/README.md)
#
#*******************************************************************************
# Zephyr's CAN API with CAN FD. The MCP251xFD driver is on by default because the
# board overlay has a microchip,mcp251xfd node; it selects SPI and CRC.
CONFIG_CAN=y
CONFIG_CAN_FD_MODE=y
# The driver's interrupt thread also runs CanIf's receive and state callbacks
CONFIG_CAN_MCP251XFD_INT_THREAD_STACK_SIZE=1024
# Boot configuration (options in _DI/Kconfig, "CAN bus"); changed at runtime by
# gi_CanIf_Configure()
# Classic CAN 2.0 at boot, so a classic-only bus monitor sees all of it. The
# driver keeps CAN FD (CAN_FD_MODE) for a UDS target that asks for it.
CONFIG_CANIF_FD=n
CONFIG_CANIF_BITRATE=500000
# Data-phase bitrate, used only in CAN FD mode
CONFIG_CANIF_BITRATE_DATA=2000000
CONFIG_CANIF_LISTEN_ONLY=n
# The loopback self-test also sends its two frames on the bus (the MCP2518FD's
# loopback is external): set y on the bench only
CONFIG_CANIF_SELFTEST=n
# Log received frames (at most 20 a second)
CONFIG_CANIF_LOG_RX=y
# Bench check: a test frame every n ms (0 = off). Never on a vehicle.
CONFIG_CANIF_TEST_TX_PERIOD_MS=1000

#*******************************************************************************
#
# UDS (_LIB/UdsClient, _ASW/_UDS; _DOC/UDS/README.md)
#
#*******************************************************************************
# Zephyr's ISO-TP (ISO 15765-2), the transport of UDS
CONFIG_ISOTP=y
# Pad frames with 0xCC (most ECUs expect full frames); TARGET must ask for padding
CONFIG_ISOTP_ENABLE_TX_PADDING=y
# Receive pool for a whole response of up to 1 KiB (17 x 63 bytes)
CONFIG_ISOTP_RX_BUF_COUNT=17
# Requests are sent blocking from the UDS thread: no buffered send contexts
CONFIG_ISOTP_ENABLE_CONTEXT_BUFFERS=n
# UDS diagnostics and flashing (options in _DI/Kconfig, "UDS")
CONFIG_UDS=y
# UDS over BLE: only the trusted host reaches it (host authentication)
CONFIG_UDS_CMD=y
CONFIG_UDS_RESPONSE_MAX=1024
CONFIG_UDS_FLASH_BLOCK_MAX=2048

#*******************************************************************************
#
# CRC
#
#*******************************************************************************
# Enable the CRC library (SETU checks each object with crc32_ieee())
CONFIG_CRC=y

#*******************************************************************************
#
# ZBUS
#
#*******************************************************************************
# Enable ZBUS in Zephyr
CONFIG_ZBUS=y

#*******************************************************************************
#
# BLE
#
#*******************************************************************************
# Enable Bluetooth support in Zephyr
CONFIG_BT=y
# Enable peripheral role (host link; peer link when pairing as peripheral)
CONFIG_BT_PERIPHERAL=y
# Enable central role (peer link when pairing as central: scan and connect)
CONFIG_BT_CENTRAL=y
# Enable GATT client role
CONFIG_BT_GATT_CLIENT=y
# Device name and appearance, served by Zephyr's built-in GAP service (CONFIG_BT_GAP_SVC).
# Don't define another GAP service in the application: the host allows only one
# and bt_enable() fails with -EINVAL otherwise.
# Device name that will appear during advertising and when connected
CONFIG_BT_DEVICE_NAME="ProjectHanuman"
# Device appearance (2-Wheeled Vehicle, 0x08C3 = BLE_APPEARANCE_MOTORIZED_VEHICLE_2_WHEELED_VEHICLE)
CONFIG_BT_DEVICE_APPEARANCE=2243
# Simultaneous connections: the host link and, while pairing or paired, the
# peer link. The controller reserves links per role (central links =
# BT_MAX_CONN - peripheral links): two peripheral links (host + peer as
# peripheral) and one central link (peer as central) make 3. The application
# itself keeps at most one host link and one peer link.
CONFIG_BT_MAX_CONN=3
CONFIG_BT_CTLR_SDC_PERIPHERAL_COUNT=2
# BLE security settings (Security Manager Protocol)
# Enable SMP for pairing and bonding
CONFIG_BT_SMP=y
# Certificate-based pairing (_PAIR): LE Secure Connections with OOB data,
# bonded. pairing_accept lets the application refuse pairing on any link but
# the verified peer link. Bonds are stored with the settings (ZMS).
CONFIG_BT_SMP_APP_PAIRING_ACCEPT=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_MAX_PAIRED=4
CONFIG_BT_OOB_DATA_FIXED=n
# Scan from the identity address. Without it (and without privacy) Zephyr
# scans from a non-resolvable private address whenever the device is not
# advertising, as the central is while its host is connected; the controller
# then drops the peer's directed advertising, addressed to the identity, and
# pairing times out in ARMED.
CONFIG_BT_SCAN_WITH_IDENTITY=y
# Pairing configuration
CONFIG_PAIR_TIMEOUT_MS=60000
CONFIG_PAIR_CONNECT_TIMEOUT_MS=30000
# Host authentication (_HOST_AUTH): the host link's SMP callbacks supply the
# passkey derived from the handshake (app_passkey; the device is DisplayOnly
# there), the host enters it: LE Secure Connections passkey entry, level 4
CONFIG_BT_APP_PASSKEY=y
# The host window (DK Button 3): undirected advertising only while it is open
CONFIG_HOST_AUTH_WINDOW_MS=120000
CONFIG_HOST_AUTH_GRACE_MS=60000
CONFIG_HOST_AUTH_FORGET_HOLD_MS=3000
CONFIG_HOST_AUTH_TIMEOUT_MS=30000
# Bench/HIL images without a hand on the button: y opens the window at boot
CONFIG_HOST_AUTH_BOOT_WINDOW=n
# PHY update support
# Don't auto-update PHY
CONFIG_BT_AUTO_PHY_UPDATE=n
# Enable PHY update support in the stack
CONFIG_BT_PHY_UPDATE=y
# Allow the application to trigger PHY updates
CONFIG_BT_USER_PHY_UPDATE=y
# Data length update support
# Don't auto-update data length
CONFIG_BT_AUTO_DATA_LEN_UPDATE=n
# Enable data length update support in the stack
CONFIG_BT_DATA_LEN_UPDATE=y
# Allow the application to trigger data length updates
CONFIG_BT_USER_DATA_LEN_UPDATE=y
# MTU update support
# Don't auto-update MTU
CONFIG_BT_GATT_AUTO_UPDATE_MTU=n
# Connection parameter update support
# Don't auto-update connection parameters
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
# Controller data length (PDU payload) max = 251 bytes
# Set the maximum data length for BLE packets to 251 bytes (max for Bluetooth 5)
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
# ACL buffer sizes must match data length
# Set the ACL RX buffer size to 251 bytes to match the maximum data length
CONFIG_BT_BUF_ACL_RX_SIZE=251
# Set the ACL TX buffer size to 251 bytes to match the maximum data length
CONFIG_BT_BUF_ACL_TX_SIZE=251
# L2CAP TX MTU = payload (244) + 3-byte ATT header
# Set the L2CAP TX MTU to 247 bytes (244 bytes of payload + 3 bytes for ATT header)
CONFIG_BT_L2CAP_TX_MTU=247
# BLE buffer counts (RX-priority profile)
# Keep TX queue modest for ACK/notification traffic
CONFIG_BT_CTLR_SDC_TX_PACKET_COUNT=6
CONFIG_BT_BUF_ACL_TX_COUNT=6
# Must stay greater than ACL TX count
CONFIG_BT_BUF_EVT_RX_COUNT=10
# Increase controller + host RX depth for sustained inbound throughput
CONFIG_BT_CTLR_SDC_RX_PACKET_COUNT=20
CONFIG_BT_BUF_ACL_RX_COUNT_EXTRA=24
# Keep upper TX layers aligned with reduced TX depth
CONFIG_BT_L2CAP_TX_BUF_COUNT=6
CONFIG_BT_ATT_TX_COUNT=6

# # BLE buffer counts
# # Set the number of controller packets for SDC (SoftDevice Controller) to 6
# CONFIG_BT_CTLR_SDC_TX_PACKET_COUNT=6
# # Set the number of ACL TX buffers to 6 to match the number of controller packets
# CONFIG_BT_BUF_ACL_TX_COUNT=6
# # Set the number of L2CAP TX buffers to 6 to match the number of ACL TX buffers
# CONFIG_BT_L2CAP_TX_BUF_COUNT=6
# # Set the number of ATT TX buffers to 6 to match the number of L2CAP TX buffers
# CONFIG_BT_ATT_TX_COUNT=6

#*******************************************************************************
#
# Watchdog and fatal errors
#
#*******************************************************************************
# Reset (instead of halting) after a fatal error: a stack overflow, a fault, a
# kernel panic. Set n while debugging a fault, so the CPU stays where it stopped
CONFIG_RESET_ON_FATAL_ERROR=y
# The hardware watchdog (wdt31, enabled in the board overlay) as the fallback of
# the task watchdog that _ASW/_WDT feeds (CONFIG_APP_WDT, default y)
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_HW_FALLBACK=y
# Stack high-water marks on the serial terminal, to check the stack sizes on the
# board (audit F4): uncomment, run the worst case (a wipe, a pairing, an upload
# with COMMIT) and read the "thread analyze" lines
# CONFIG_THREAD_ANALYZER=y
# CONFIG_THREAD_ANALYZER_USE_LOG=y
# CONFIG_THREAD_ANALYZER_AUTO=y
# CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=10
# CONFIG_THREAD_NAME=y

#*******************************************************************************
#
# Logging
#
#*******************************************************************************
# Enable logging in Zephyr
CONFIG_LOG=y
# Set global log level to info
CONFIG_LOG_MAX_LEVEL=3
# Set ZBUS log level to info
CONFIG_ZBUS_LOG_LEVEL_INF=y
# Set Bluetooth log level to info
CONFIG_BT_LOG_LEVEL_INF=y
# Use deferred logging to process log messages in a separate thread
CONFIG_LOG_MODE_DEFERRED=y
# Process log in a separate thread to avoid blocking BLE operations
CONFIG_LOG_PROCESS_THREAD=y
# Process log every 1 ms to minimize latency and avoid log buffer overflow during heavy logging periods
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=1
# Process log immediately when a new message is added to the buffer
CONFIG_LOG_PROCESS_TRIGGER_THRESHOLD=1
# Set total log buffer size to 5 KB to handle heavy logging without overflow
CONFIG_LOG_BUFFER_SIZE=5120
# Enable UART backend for logging
CONFIG_LOG_BACKEND_UART=y
# Set UART backend buffer size to 2048 bytes to handle large log messages without overflow
CONFIG_LOG_BACKEND_UART_BUFFER_SIZE=2048
